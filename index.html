<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>eBook Creator Mods</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #1e1e2f, #0f2027);
      color: #fff;
      text-align: center;
    }

    .container {
      max-width: 800px;
      margin: auto;
      padding: 40px 20px;
    }

    h1 {
      font-size: 2.5em;
      margin-bottom: 10px;
      text-shadow: 2px 2px 10px #00eaff;
    }

    p.subtitle {
      font-size: 1.2em;
      color: #a0eaff;
      margin-bottom: 30px;
    }

    img {
      max-width: 280px;
      margin: 30px 0;
      border-radius: 10px;
      transition: transform 0.3s;
    }

    img:hover {
      transform: scale(1.05);
    }

    .btn {
      display: block;
      margin: 20px auto;
      padding: 15px 25px;
      font-size: 18px;
      text-decoration: none;
      color: #fff;
      border-radius: 8px;
      width: 80%;
      max-width: 300px;
      transition: 0.3s;
    }

    .buy {
      background: #00c853;
    }

    .buy:hover {
      background: #00e676;
    }

    .whatsapp {
      background: #25D366;
    }

    .whatsapp:hover {
      background: #1ebe5d;
    }

    .box {
      background: rgba(255,255,255,0.1);
      padding: 20px;
      border-radius: 10px;
      margin-top: 30px;
    }

    footer {
      margin-top: 40px;
      font-size: 14px;
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <div class="container">

    <h1>📘 eBook Creator Mods</h1>
    <p class="subtitle">Aprenda a criar mods simples passo a passo, mesmo sendo iniciante.</p>

    <!-- IMAGEM DO EBOOK -->
    <img src="ebook.png" alt="Capa do eBook" />

    <!-- BOTÃO DE PAGAMENTO KIWIFY -->
    <a href="https://pay.kiwify.com.br/LGjxKCF" target="_blank" class="btn buy">
      💳 Comprar agora
    </a>

    <!-- BOTÃO DE SUPORTE WHATSAPP -->
    <a href="https://wa.me/5553997096064?text=Olá!%20Comprei%20o%20eBook%20e%20preciso%20de%20suporte" target="_blank" class="btn whatsapp">
      💬 Suporte via WhatsApp
    </a>

    <div class="box">
      <h3>📌 O que você vai aprender</h3>
      <p>
        ✔ O que são mods<br>
        ✔ Como criar mods simples<br>
        ✔ Ideias práticas<br>
        ✔ Dicas para iniciantes
      </p>
    </div>

    <footer>
      © 2026 – Todos os direitos reservados
    </footer>

  </div>
</body>
</html>
